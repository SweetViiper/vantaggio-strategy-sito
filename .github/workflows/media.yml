# One-off helper: copies the film clips, posters and share image that are
# already public on the live site into this repository.
name: Importa i media
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/media.yml"]
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica video e immagini
        run: |
          set -euo pipefail
          base="https://vantaggiostrategy.com"
          mkdir -p public/assets/world
          for n in 01 02 03 04 05; do
            for f in "scene-$n.mp4" "scene-$n-mobile.mp4" "scene-$n-poster.jpg" "scene-$n-mobile-poster.jpg"; do
              curl -fsSL --retry 3 -o "public/assets/world/$f" "$base/assets/world/$f"
            done
          done
          curl -fsSL --retry 3 -o public/og.png "$base/og.png"
          file public/assets/world/* public/og.png
          if file public/assets/world/* public/og.png | grep -qi "html\|text"; then
            echo "Un file scaricato non è un media" >&2
            exit 1
          fi
      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/world public/og.png
          git diff --cached --quiet || git commit -m "Importa video, poster e immagine di condivisione"
          git push
